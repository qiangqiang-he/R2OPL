# @package _global_

# Fair runtime baseline: PG-OPD with the same execution contract as R²OPL's
# gemma-4-26B-A4B-it Teacher -> Gemma-4-E2B-it Student configuration.

defaults:
  - /pg_opd
  - _self_

run_name: time_pg_opd_gemma4_26b_a4b_it_to_e2b_it_len8k_10steps
run_name_prefix: time_pg_opd_gemma4_26b_a4b_it_to_e2b_it_len8k_10steps
group_name: time_pg_opd

student_model_family: gemini4
teacher_model_family: gemini4

data:
  max_prompt_length: 2048
  max_response_length: 20480

actor_rollout_ref:
  model:
    path: /mnt/cephfs/LLM_MODEL_HUB/gemma/gemma-4-E2B-it
    use_remove_padding: false
    use_fused_kernels: false
    override_config:
      attn_implementation: sdpa
  actor:
    ulysses_sequence_parallel_size: 1
    ppo_mini_batch_size: 64
    ppo_micro_batch_size_per_gpu: 1
    use_dynamic_bsz: false
    # Match R²OPL's expanded packed-probe actor budget for a fair timing run.
    ppo_max_token_len_per_gpu: 24576
    # Keep canonical PG-OPD trajectory weighting; this is not an R²OPL loss.
    loss_agg_mode: seq-mean-token-mean
    fsdp_config:
      use_no_sync_for_gradient_accumulation: false
    optim:
      lr: 1.0e-6
  rollout:
    data_parallel_size: 4
    temperature: 1.0
    top_p: 1.0
    top_k: -1
    # Match the R²OPL Gemma Student memory reservation during timing.
    gpu_memory_utilization: 0.30
    max_model_len: 22528
    max_num_seqs: 64
    max_num_batched_tokens: 4096
    log_prob_use_dynamic_bsz: false
    log_prob_micro_batch_size_per_gpu: 1
    log_prob_max_token_len_per_gpu: 10241
    val_kwargs:
      temperature: 0.6
      top_p: 0.95
      top_k: -1
      do_sample: true
  ref:
    log_prob_use_dynamic_bsz: false
    log_prob_micro_batch_size_per_gpu: 1
    log_prob_max_token_len_per_gpu: 10241

rlvr_generation:
  train_max_new_tokens: 8192
  val_max_new_tokens: 20480

distillation:
  n_gpus_per_node: 4
  nnodes: 1
  teacher_chunk_size: 128
  teacher_models:
    teacher_model:
      model_path: /mnt/cephfs/LLM_MODEL_HUB/gemma/gemma-4-26B-A4B-it
      inference:
        enable_sleep_mode: false
        free_cache_engine: false
        prompt_length: 2048
        response_length: 8192
        tensor_model_parallel_size: 1
        gpu_memory_utilization: 0.85
        max_model_len: 22528
        engine_kwargs:
          vllm:
            max_logprobs: 16
  distillation_loss:
    loss_mode: reverse_kl
    topk: null
    diagnostic_topk: 16
    selection_ratio: 1.0
    selection_method: random
    use_task_rewards: false
    # Preserve canonical PG-OPD, rather than changing its objective to R²OPL.
    loss_max_clamp: 20.0
    log_prob_min_clamp: null
    use_policy_gradient: true
    policy_loss_mode: reinforce

trainer:
  n_gpus_per_node: 4
  nnodes: 1
  experiment_name: ${run_name}
  total_training_steps: 10
  default_local_dir: ./outputs/${run_name}
  val_before_train: false
  test_freq: 50
  save_freq: 50
