# Shared Student-side defaults for every R2OPL algorithm.

defaults:
  - /ppo_trainer
  - _self_

prompt_template: explicit_step_prompt
student_model_family: qwen3
run_name: ""
run_name_prefix: r2opl

data:
  train_files: ["./data/Math–Science–Logic-32K.json"]
  # MSL_Eval.json is only the physical container. Evaluation uses exactly the
  # named datasets below; remove a name here to exclude that benchmark.
  val_files: ["./data/MSL_Eval.json"]
  val_datasets:
    - AMC23
    - AIME24
    - AIME25
    - MATH-500
    - GPQA-D
    - SciBench
    - LogicBench
    - LogiQA2.0
  max_prompt_length: 2048
  max_response_length: 16384
  # One optimization batch contains 64 questions and four independently
  # sampled trajectories per question (256 trajectories in total).
  train_batch_size: 64
  # Evaluate every record present in the evaluation file; do not bind runtime
  # behavior to a hard-coded dataset size.
  val_max_samples: -1
  # Never discard an example solely because its prompt is long. The custom
  # dataset keeps the prompt prefix and truncates the end of the question.
  filter_overlong_prompts: false
  truncation: right
  shuffle: true
  seed: 42

actor_rollout_ref:
  model:
    path: /mnt/cephfs/LLM_MODEL_HUB/qwen/Qwen3-1.7B
    trust_remote_code: true
    enable_gradient_checkpointing: true
    use_remove_padding: true
    use_fused_kernels: true
    fused_kernel_options:
      impl_backend: torch
    override_config:
      attn_implementation: sdpa
    lora_rank: 0
    lora:
      rank: 0

  actor:
    strategy: fsdp
    ulysses_sequence_parallel_size: 1
    # VERL interprets this in question units and multiplies it by rollout.n.
    ppo_mini_batch_size: 64
    ppo_micro_batch_size_per_gpu: 1
    ppo_epochs: 1
    use_dynamic_bsz: true
    ppo_max_token_len_per_gpu: 10241
    loss_agg_mode: seq-mean-token-mean
    entropy_coeff: 0.0
    use_kl_loss: false
    kl_loss_coef: 0.0
    optim:
      lr: 1.0e-6
      lr_warmup_steps_ratio: 0.0
      weight_decay: 0.01
      lr_scheduler_type: cosine
      clip_grad: 1.0
    fsdp_config:
      param_offload: true
      optimizer_offload: true

  rollout:
    name: vllm
    mode: async
    dtype: bfloat16
    # Disabled globally: the deployment driver's vLLM sleep mode is unsupported.
    enable_sleep_mode: false
    temperature: 1.0
    top_p: 1.0
    top_k: -1
    n: 4
    tensor_model_parallel_size: 1
    data_parallel_size: 8
    gpu_memory_utilization: 0.40
    max_model_len: 18432
    max_num_batched_tokens: 18432
    max_num_seqs: 256
    engine_kwargs:
      vllm:
        max_logprobs: 16
    # Prevent VERL from calling sleep()/wake_up() while sleep mode is disabled.
    free_cache_engine: false
    enable_chunked_prefill: true
    enable_prefix_caching: true
    log_prob_use_dynamic_bsz: true
    log_prob_max_token_len_per_gpu: 10241
    val_kwargs:
      temperature: 0.6
      top_p: 0.95
      top_k: -1
      do_sample: true
      n: 16

  ref:
    log_prob_use_dynamic_bsz: true
    log_prob_max_token_len_per_gpu: 10241
    fsdp_config:
      param_offload: true

algorithm:
  adv_estimator: grpo
  norm_adv_by_std_in_grpo: true
  use_kl_in_reward: false

rlvr_generation:
  train_max_new_tokens: 8192
  val_max_new_tokens: 16384

distillation:
  # Algorithms that need a Teacher must opt in from their algorithm base.
  enabled: false

reward:
  num_workers: 4
  custom_reward_function:
    path: ./utils/reward.py
    name: compute_score
  reward_model:
    enable: false

critic:
  strategy: fsdp

trainer:
  project_name: "R^2OPL"
  logger: [console, wandb]
  n_gpus_per_node: 8
  nnodes: 1
  total_training_steps: 100
  total_epochs: 100
  val_before_train: true
  test_freq: 20
  save_freq: 20
  resume_mode: auto
  log_val_generations: 10
  seed: 42
