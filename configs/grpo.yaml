# KL-free GRPO base configuration using all eight GPUs for the Student.

defaults:
  - /base
  - _self_

run_name: grpo_qwen3
run_name_prefix: grpo_qwen3
group_name: GRPO

algorithm:
  name: grpo
  adv_estimator: grpo
  norm_adv_by_std_in_grpo: true
  use_kl_in_reward: false

actor_rollout_ref:
  actor:
    clip_ratio: 0.2
    clip_ratio_low: 0.2
    clip_ratio_high: 0.2
    loss_agg_mode: seq-mean-token-mean
    use_kl_loss: false
    kl_loss_coef: 0.0

distillation:
  enabled: false

# Expected Reasoning-Step Return machinery stays configured for quick
# re-enable but is disabled for the current experiment schedule.
ersr:
  enabled: false
  datasets:
    - AMC23
    - SciBench
    - LogicBench
  max_steps_per_dataset: 500
  mc_k: 2
  max_teacher_step_tokens: 2048
  temperature: 0.6
  top_p: 0.95
  top_k: -1
  seed: 42

trainer:
  n_gpus_per_node: 8
  experiment_name: ${run_name}
  default_local_dir: ./outputs/${run_name}
