# @package _global_

# R^2OPL-base: gemma-4-26B-A4B-it Teacher -> Gemma-4-E2B-it Student
# (miu=16, lambda=0.05).

defaults:
  - /r2opl_base
  - _self_

run_name: r2opl_base_gemma4_26b_a4b_it_to_e2b_it_len12k_lambda0p05_miu16_500steps
run_name_prefix: r2opl_base_gemma4_26b_a4b_it_to_e2b_it_len12k_lambda0p05_miu16_500steps

student_model_family: gemini4
teacher_model_family: gemini4

algorithm:
  name: r2opl_base
  r2opl_base:
    lambda: 0.05
    miu: 16

data:
  max_prompt_length: 2048
  max_response_length: 20480

actor_rollout_ref:
  model:
    path: /mnt/cephfs/LLM_MODEL_HUB/gemma/gemma-4-E2B-it
  actor:
    ppo_max_token_len_per_gpu: 14337
    optim:
      lr: 1.0e-6
  rollout:
    temperature: 1.0
    top_p: 1.0
    top_k: -1
    # Leave 60% of each Student GPU for FSDP training and R²OPL backward peaks.
    gpu_memory_utilization: 0.40
    max_model_len: 22528
    max_num_batched_tokens: 18432
    log_prob_max_token_len_per_gpu: 14337
    val_kwargs:
      temperature: 0.6
      top_p: 0.95
      top_k: -1
      do_sample: true
  ref:
    log_prob_max_token_len_per_gpu: 14337

rlvr_generation:
  train_max_new_tokens: 12288
  val_max_new_tokens: 20480

distillation:
  teacher_chunk_size: 128
  teacher_models:
    teacher_model:
      model_path: /mnt/cephfs/LLM_MODEL_HUB/gemma/gemma-4-26B-A4B-it
      inference:
        enable_sleep_mode: false
        free_cache_engine: false
        response_length: 12288
        # One complete 26B-A4B BF16 Teacher replica on each dedicated GPU.
        tensor_model_parallel_size: 1
        gpu_memory_utilization: 0.85
        max_model_len: 22528
        engine_kwargs:
          vllm:
            max_logprobs: 16
  distillation_loss:
    loss_mode: r2opl_base
    selection_ratio: 1.0
    selection_method: random
    loss_max_clamp: 20.0
    log_prob_min_clamp: null
    policy_loss_mode: reinforce

trainer:
  experiment_name: ${run_name}
  total_training_steps: 500
  default_local_dir: ./outputs/${run_name}
  val_before_train: false
  test_freq: 25
  save_freq: 25
