# @package _global_

# Single-GPU formal-entrypoint verification of GRPO (no Teacher needed).
# Runs the complete start_train.sh pipeline: hydra compose → init_workers →
# CheckpointEngineManager → online rollout + training loop + weight sync.

defaults:
  - /grpo/grpo_qwen3_1p7b_len12k_500steps
  - _self_

run_name: grpo_formal_entry_single_gpu
run_name_prefix: grpo_formal_entry_single_gpu

student_model_family: qwen3

data:
  train_batch_size: 4
  max_prompt_length: 2048
  max_response_length: 4096
  val_datasets: [AMC23]
  val_max_samples: 2

actor_rollout_ref:
  model:
    path: ./models/Qwen3-1.7B
  actor:
    ppo_mini_batch_size: 4
    ppo_max_token_len_per_gpu: 6145
    optim:
      lr: 1.0e-7
  rollout:
    n: 4
    data_parallel_size: 1
    max_model_len: 6145
    max_num_batched_tokens: 6145
    max_num_seqs: 8
    temperature: 1.0
    top_p: 1.0
    top_k: -1
    log_prob_max_token_len_per_gpu: 6145
    val_kwargs:
      n: 4
      temperature: 0.6
      top_p: 0.95
      top_k: -1
      do_sample: true
  ref:
    log_prob_max_token_len_per_gpu: 6145

rlvr_generation:
  train_max_new_tokens: 512
  val_max_new_tokens: 512

trainer:
  n_gpus_per_node: 1
  nnodes: 1
  total_training_steps: 2
  total_epochs: 1
  val_before_train: false
  test_freq: 1
  save_freq: -1
  logger: [console]
  experiment_name: ${run_name}
  default_local_dir: ./outputs/${run_name}
